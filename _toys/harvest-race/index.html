<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harvest Race · Bed of Rice</title>
<style>
  html,body{margin:0;height:100%;background:#6f8d3c;overflow:hidden;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  body.idle canvas{cursor:none}
  #fs{position:fixed;top:10px;right:10px;z-index:2;font:600 14px ui-rounded,system-ui,sans-serif;
      background:rgba(40,28,18,.7);color:#fff3d0;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
  body.idle #fs,:fullscreen #fs{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="fs" title="Full screen (F)">⛶ Full screen</button>
<script>
'use strict';
/* Harvest Race: a Bed of Rice toy. 1 to 4 players cut a paddy of tall rice and
   walk over the sheaves to collect them. Most rice by sunset wins.
   One button: tap = swing the sickle, hold + let go = throw it (it flies back),
   tap while it's out = call it back. Start = begin / pause. */

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 1280, H = 720;
const FONT = "ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,sans-serif";

// ---- tuning knobs -------------------------------------------------------
const ROUND = 90;            // seconds from sunrise to sunset
const COUNT = 2.4;           // 3-2-1 before the day starts
const SPEED_OPEN = 235;      // px/s on stubble, the bund, cut paths
const SPEED_RICE = 135;      // px/s wading through tall rice
const ACCEL = 2600;          // px/s² speeding up: high = snappy start (top speed in ~0.09 s)
const FRICTION = 1900;       // px/s² slowing down with the stick let go: a short slide = weight
const SKID = 5200;           // px/s² when you reverse at speed (skid + dust)
const LEAN = .22;            // how far the body tips into a change of speed
const CHARGE_SLOW = 0.55;    // speed multiplier while winding up a throw
const SLASH_R = 54, SLASH_CD = 0.18;   // the spin (3rd tap) waits 0.4 s
const HOLD_MIN = 0.18, CHARGE_T = 0.75;     // hold longer than HOLD_MIN = throw
const THROW_MIN = 170, THROW_MAX = 600, BOOM_SPEED = 640, BOOM_R = 24;
const PICK_R = 26, MAGNET_R = 54;
const GOLD_CHANCE = 0.035, GOLD_VALUE = 5;
const DUCKS = 3, DUCK_EAT = 2.2, DIZZY = 0.8;
// co-op: a rope between partners cuts what's between them; swing together = double spin;
// boost up a terrace wall; a storm halfway through soaks sheaves left lying on the ground
const ROPE_MIN = 90, ROPE_MAX = 340, ROPE_R = 13, ROPE_DRAG = .72;
const SYNC_WIN = .22, SYNC_D = 170;
const STORM_AT = 40, STORM_W = 360, STORM_SPEED = 115, SOAK = .7;
const STARS_DUO = [.55, .75, .92], STARS_SOLO = [.35, .55, .75], STARS_CREW = [.6, .8, .95];   // share of the field's rice for 1, 2, 3 stars (1 player, 2, 3 or 4)
const CREW_DUCKS = 2;   // co-op: extra ducks for each player past two

// ---- layout ---------------------------------------------------------------
const SKY_H = 108;
const BUND = {x0:16, y0:110, x1:1264, y1:714}, BW = 26;
const PADDY = {x0:BUND.x0+BW, y0:BUND.y0+BW, x1:BUND.x1-BW, y1:BUND.y1-BW};
const CELL = 24, ROWH = 21;
const X0 = PADDY.x0 + 14, Y0 = PADDY.y0 + 30;
const COLS = Math.floor((PADDY.x1 - 14 - X0 - CELL/2) / CELL) + 1;
const ROWS = Math.floor((PADDY.y1 - 6 - Y0) / ROWH) + 1;
const N = COLS * ROWS;
const TX = new Float32Array(N), TY = new Float32Array(N), RUST = new Float32Array(N), PH = new Float32Array(N);
const TALL = new Uint8Array(N), GOLD = new Uint8Array(N), VAR = new Uint8Array(N), TT = new Uint8Array(N);
let tallCount = 0, TOTAL = N;

// ---- fields (levels) --------------------------------------------------------------
// Terraces: tiers of paddy stepped down the hill, held up by stone walls. Walk off an
// edge (stick pushed down) to hop down a tier; the only way up is the stairs.
const WALL_H = 38, DIKE = 14, STAIR_W = 52, DROP_HOP = 170, GRAV_Z = 1900, STAIR_SLOW = .7;
const LEVELS = [
  {id:'paddy', name:'Rice paddy', walls:[]},
  {id:'terraces', name:'Rice terraces', walls:[
    {y:236, a:14, f:.0105, ph:.4,  b:7, g:.023, q:1.7, stairs:[330, 950]},
    {y:399, a:16, f:.0088, ph:2.1, b:6, g:.019, q:.3,  stairs:[64, 640, 1216]},
    {y:562, a:15, f:.0097, ph:4.0, b:7, g:.021, q:2.6, stairs:[330, 950]},
  ]},
];
let levelIdx = 1, LV = LEVELS[1], WALLS = LV.walls;   // a fresh browser starts on the terraces
try { const saved = localStorage.getItem('harvestRaceField'); if (saved) levelIdx = Math.max(0, LEVELS.findIndex(l => l.id === saved)); } catch(e) {}
function setLevel(i){
  levelIdx = (i + LEVELS.length) % LEVELS.length; LV = LEVELS[levelIdx]; WALLS = LV.walls;
  try { localStorage.setItem('harvestRaceField', LV.id); } catch(e) {}
}
setLevel(levelIdx);
let COOP = false;   // Race (most rice wins) or Co-op (one shared basket)
try { COOP = localStorage.getItem('harvestRaceMode') === 'coop'; } catch(e) {}
function wallTop(k, x){ const w = WALLS[k]; return w.y + w.a*Math.sin(x*w.f + w.ph) + w.b*Math.sin(x*w.g + w.q); }
const wallBot = (k, x) => wallTop(k, x) + WALL_H;
function tierAt(x, y){ let t = 0; for (let k=0; k<WALLS.length; k++) if (y > wallTop(k, x) + WALL_H/2) t = k+1; return t; }
function stairAt(k, x, m=0){ for (const sx of WALLS[k].stairs) if (Math.abs(x - sx) < STAIR_W/2 - m) return sx; return null; }
// the ground of one tier at x: [top, bottom]
function tierBounds(t, x){ return [t > 0 ? wallBot(t-1, x) + 4 : PADDY.y0 + 6, t < WALLS.length ? wallTop(t, x) - 2 : PADDY.y1 - 2]; }

const COLORS = [
  {c:'#ff7b6b', d:'#c4473b', n:'Salmon'},
  {c:'#38b7a8', d:'#1f7d72', n:'Matcha'},
  {c:'#f2b632', d:'#b07d10', n:'Tamago'},
  {c:'#9a85ef', d:'#5f4bb5', n:'Ube'},
];
const SPAWNS = [[BUND.x0+14,BUND.y0+16],[BUND.x1-14,BUND.y0+16],[BUND.x0+14,BUND.y1-8],[BUND.x1-14,BUND.y1-8]];

const G = {
  state:'lobby', t:0, clock:0, countT:0, endT:0, goT:0, cleared:false,
  players:[], ducks:[], sheaves:[], booms:[], parts:[], texts:[], falls:[], hitstop:0, shake:0,
  gust:{on:false, x:-300, next:4}, toast:null, padsSeen:[], manual:false, best:0,
  rings:[], team:0, lostDuck:0, lostRain:0, storm:{phase:'none'}, awards:[], maxValue:1, roundPlayers:1,
  starsGot:0, endSfx:new Set(), coopBest:0, ropeSfxT:0,
};
try { G.best = +localStorage.getItem('harvestRaceBest') || 0; } catch(e) {}

const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;

// ---- sprites ----------------------------------------------------------------
function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
const SPR_W=44, SPR_H=60, SPR_AX=22, SPR_AY=56;
function makeTuft(seed, gold){
  const c = mk(SPR_W*2, SPR_H*2), g = c.getContext('2d'); g.scale(2,2);
  let s = seed; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  g.fillStyle = 'rgba(60,40,10,.28)'; g.beginPath(); g.ellipse(SPR_AX, SPR_AY, 13, 5, 0, 0, 7); g.fill();
  g.lineCap = 'round';
  g.strokeStyle = '#8f8a3a'; g.lineWidth = 1.8;
  for (const d of [-1,1]) { g.beginPath(); g.moveTo(SPR_AX, SPR_AY-2); g.quadraticCurveTo(SPR_AX+d*10, SPR_AY-18, SPR_AX+d*16, SPR_AY-13); g.stroke(); }
  const stalks = 9;
  for (let i=0; i<stalks; i++) {
    const bx = SPR_AX + (i-(stalks-1)/2)*2.2 + (rnd()-.5)*2;
    const lean = (i-(stalks-1)/2)*1.6 + (rnd()-.5)*4;
    const h = 40 + rnd()*12, tx = bx + lean, ty = SPR_AY - h;
    g.strokeStyle = i%2 ? '#a88a34' : '#c4a447'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(bx, SPR_AY-1); g.quadraticCurveTo(bx+lean*.3, SPR_AY-h*.6, tx, ty); g.stroke();
    const dir = lean >= 0 ? 1 : -1;
    for (let k=0; k<6; k++) {
      const u = k/5, gx = tx + dir*u*7, gy = ty + u*u*12 - 1;
      g.fillStyle = gold ? (k%2?'#ffd84a':'#fff3a8') : (k%2?'#e2b43c':'#f2cf63');
      g.beginPath(); g.ellipse(gx, gy, 2.1, 1.4, dir*(.6+u), 0, 7); g.fill();
    }
  }
  return c;
}
const TUFTS = [1,2,3,4].map(k => makeTuft(k*7919, false));
const GOLDS = [5,6].map(k => makeTuft(k*7919, true));
// darker copies for the rice standing in a terrace wall's shadow
function shaded(c){ const d = mk(c.width, c.height), g = d.getContext('2d'); g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(45,30,12,.36)'; g.fillRect(0, 0, d.width, d.height); return d; }
const TUFTS_SH = TUFTS.map(shaded), GOLDS_SH = GOLDS.map(shaded);
const SHADE = new Uint8Array(N);
function makeSheaf(gold){
  const c = mk(32,40), g = c.getContext('2d'); g.scale(2,2); g.lineCap='round';
  for (let i=0; i<7; i++) {
    const bx = 8+(i-3)*.8, tx = 8+(i-3)*2.3;
    g.strokeStyle = i%2?'#b8963c':'#d3b04f'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(bx,19); g.lineTo(tx,4); g.stroke();
    g.fillStyle = gold ? (i%2?'#ffe066':'#fff4b0') : (i%2?'#e9bd45':'#f6d777');
    g.beginPath(); g.ellipse(tx,3.5,1.7,3.1,(i-3)*.15,0,7); g.fill();
  }
  g.fillStyle = gold ? '#e0662c' : '#8a5a2b'; g.fillRect(4.3,11,7.4,2.4);
  return c;
}
const SHEAF = makeSheaf(false), SHEAF_GOLD = makeSheaf(true);

// field background (ground + stubble gets stamped in as rice is cut)
const BG = mk(W*2, H*2), bg = BG.getContext('2d'); bg.scale(2,2);
function rr(c,x,y,w,h,r){ c.beginPath(); c.roundRect ? c.roundRect(x,y,w,h,r) : c.rect(x,y,w,h); }
function paintBG(){
  let s = 12345; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  bg.fillStyle = '#6f8d3c'; bg.fillRect(0,0,W,H);
  for (let i=0; i<500; i++) { bg.fillStyle = rnd()<.5 ? 'rgba(40,70,20,.25)' : 'rgba(150,180,90,.25)'; bg.fillRect(rnd()*W, rnd()*H, 2, 4); }
  rr(bg, BUND.x0, BUND.y0, BUND.x1-BUND.x0, BUND.y1-BUND.y0, 18); bg.fillStyle = '#86a24a'; bg.fill();
  if (WALLS.length) return paintTerraces(rnd);
  bg.strokeStyle = '#ab935a'; bg.lineWidth = 12;
  rr(bg, BUND.x0+BW/2, BUND.y0+BW/2, BUND.x1-BUND.x0-BW, BUND.y1-BUND.y0-BW, 12); bg.stroke();
  rr(bg, PADDY.x0, PADDY.y0, PADDY.x1-PADDY.x0, PADDY.y1-PADDY.y0, 10); bg.fillStyle = '#8a7443'; bg.fill();
  for (let i=0; i<1600; i++) {
    const x = PADDY.x0 + rnd()*(PADDY.x1-PADDY.x0), y = PADDY.y0 + rnd()*(PADDY.y1-PADDY.y0);
    bg.fillStyle = rnd()<.5 ? 'rgba(60,45,20,.2)' : 'rgba(190,160,100,.16)';
    bg.fillRect(x, y, 2+rnd()*4, 1+rnd()*2);
  }
  bg.strokeStyle = 'rgba(50,35,15,.35)'; bg.lineWidth = 4;
  rr(bg, PADDY.x0+2, PADDY.y0+2, PADDY.x1-PADDY.x0-4, PADDY.y1-PADDY.y0-4, 9); bg.stroke();
}
// trace y = fy(x) from xa to xb (lineTo; start with moveTo if first)
function along(c, fy, xa, xb, first){
  const n = Math.ceil(Math.abs(xb - xa)/8);
  for (let s=0; s<=n; s++) { const x = xa + (xb - xa)*s/n, y = fy(x); (first && !s) ? c.moveTo(x, y) : c.lineTo(x, y); }
}
function paintTerraces(rnd){
  const T = WALLS.length, xa = PADDY.x0, xb = PADDY.x1;
  // the ground of each tier (the grass strip above each wall is the dike you can run along)
  for (let t=0; t<=T; t++) {
    bg.beginPath();
    along(bg, x => t ? wallBot(t-1, x) + 2 : PADDY.y0, xa, xb, true);
    along(bg, x => t < T ? wallTop(t, x) - DIKE : PADDY.y1, xb, xa, false);
    bg.closePath(); bg.fillStyle = '#8a7443'; bg.fill();
    if (T - t) { bg.fillStyle = `rgba(255,245,220,${(T-t)*.035})`; bg.fill(); }   // a little haze on the higher tiers
  }
  for (let i=0; i<1600; i++) {
    const x = xa + rnd()*(xb-xa), y = PADDY.y0 + rnd()*(PADDY.y1-PADDY.y0);
    bg.fillStyle = rnd()<.5 ? 'rgba(60,45,20,.2)' : 'rgba(190,160,100,.16)';
    bg.fillRect(x, y, 2+rnd()*4, 1+rnd()*2);
  }
  for (let k=0; k<T; k++) {
    const X0w = BUND.x0 + 4, X1w = BUND.x1 - 4;
    // cast shadow on the tier below
    bg.beginPath(); along(bg, x => wallBot(k, x), X0w, X1w, true); along(bg, x => wallBot(k, x) + 13, X1w, X0w, false); bg.closePath();
    bg.fillStyle = 'rgba(30,20,5,.2)'; bg.fill();
    // the stone face
    const face = () => { bg.beginPath(); along(bg, x => wallTop(k, x), X0w, X1w, true); along(bg, x => wallBot(k, x), X1w, X0w, false); bg.closePath(); };
    face(); bg.fillStyle = '#6e5d45'; bg.fill();
    bg.save(); face(); bg.clip();
    for (let row=0; row<Math.ceil(WALL_H/8.2); row++) for (let x = X0w - (row%2)*9; x < X1w; ) {
      const w = 13 + rnd()*8, y = wallTop(k, x + w/2) + 1.5 + row*8.2;
      bg.fillStyle = ['#8f7d5f', '#9a8866', '#7c6b50', '#a39272'][(rnd()*4)|0];
      rr(bg, x + 1, y, w - 2, 7, 3); bg.fill();
      bg.fillStyle = 'rgba(255,250,230,.12)'; bg.fillRect(x + 2, y + .5, w - 5, 1.5);
      x += w;
    }
    bg.restore();
    bg.lineCap = 'round';
    bg.strokeStyle = 'rgba(40,28,14,.55)'; bg.lineWidth = 2; bg.beginPath(); along(bg, x => wallBot(k, x), X0w, X1w, true); bg.stroke();
    bg.strokeStyle = '#a9c266'; bg.lineWidth = 3.5; bg.beginPath(); along(bg, x => wallTop(k, x), X0w, X1w, true); bg.stroke();
    // stairs cut into the wall
    for (const sx of WALLS[k].stairs) {
      const a = sx - STAIR_W/2, b = sx + STAIR_W/2;
      bg.beginPath(); along(bg, x => wallTop(k, x) - 5, a, b, true); along(bg, x => wallBot(k, x) + 5, b, a, false); bg.closePath();
      bg.fillStyle = '#b8a074'; bg.fill();
      bg.strokeStyle = '#5d4d38'; bg.lineWidth = 2.5; bg.stroke();
      for (let s=1; s<=5; s++) {
        const u = s/6, y0 = wallTop(k, a) - 5 + (WALL_H + 10)*u, y1 = wallTop(k, b) - 5 + (WALL_H + 10)*u;
        bg.strokeStyle = '#8a7350'; bg.lineWidth = 2.2; bg.beginPath(); bg.moveTo(a + 4, y0); bg.lineTo(b - 4, y1); bg.stroke();
        bg.strokeStyle = 'rgba(255,245,215,.45)'; bg.lineWidth = 1; bg.beginPath(); bg.moveTo(a + 4, y0 + 2); bg.lineTo(b - 4, y1 + 2); bg.stroke();
      }
    }
  }
}
function stampStubble(x,y){
  bg.fillStyle = 'rgba(70,50,20,.22)'; bg.beginPath(); bg.ellipse(x,y,9,3.5,0,0,7); bg.fill();
  bg.lineCap = 'round'; bg.lineWidth = 1.5;
  for (let k=0; k<6; k++) {
    const bx = x + (k-2.5)*2.4 + rand(-1,1), h = rand(4,8);
    bg.strokeStyle = k%2 ? '#c2a456' : '#9b7f36';
    bg.beginPath(); bg.moveTo(bx, y); bg.lineTo(bx + rand(-1.5,1.5), y-h); bg.stroke();
  }
}

// terraced hills on the horizon
const HILLS = [0,1].map(L => {
  const pts = []; let x = -10, y = L ? 80 : 64;
  while (x <= W+60) { pts.push([x,y]); x += 28 + Math.random()*54; pts.push([x,y]); y = clamp(y + (Math.random()-.5)*16, L?64:46, L?98:86); }
  return pts;
});

// ---- field ----------------------------------------------------------------
function resetField(){
  paintBG(); tallCount = 0; let value = 0;
  for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) {
    const i = r*COLS + c;
    TX[i] = X0 + c*CELL + ((r&1) ? CELL/2 : 0) + rand(-3,3);
    TY[i] = Y0 + r*ROWH + rand(-2.5,2.5);
    TT[i] = tierAt(TX[i], TY[i]);
    SHADE[i] = TT[i] > 0 && TY[i] - wallBot(TT[i]-1, TX[i]) < 32 ? 1 : 0;
    TALL[i] = noRiceAt(TX[i], TY[i]) ? 0 : 1; GOLD[i] = Math.random() < GOLD_CHANCE ? 1 : 0;
    RUST[i] = 0; PH[i] = Math.random()*6.283; VAR[i] = (Math.random()*4)|0;
    tallCount += TALL[i]; if (TALL[i]) value += GOLD[i] ? GOLD_VALUE : 1;
  }
  TOTAL = tallCount; G.maxValue = value;
}
// no rice on a wall, on the dike along its top, right under it, or on the stair landings
function noRiceAt(x, y){
  for (let k=0; k<WALLS.length; k++) {
    const top = wallTop(k, x);
    if (y > top - DIKE - 3 && y < top + WALL_H + 10) return true;
    if (stairAt(k, x, -12) !== null && y > top - DIKE - 18 && y < top + WALL_H + 24) return true;
  }
  return false;
}
function eachCell(x,y,rad,fn){
  const r0 = Math.max(0, Math.floor((y-rad-Y0)/ROWH)), r1 = Math.min(ROWS-1, Math.ceil((y+rad-Y0)/ROWH));
  const c0 = Math.max(0, Math.floor((x-rad-X0)/CELL)-1), c1 = Math.min(COLS-1, Math.ceil((x+rad-X0)/CELL));
  for (let r=r0; r<=r1; r++) for (let c=c0; c<=c1; c++) {
    const i = r*COLS + c, dx = TX[i]-x, dy = TY[i]-y;
    if (dx*dx + dy*dy <= rad*rad && fn(i) === true) return true;
  }
  return false;
}
// tier < 0 = any tier (the thrown sickle flies over the walls)
const tallNear = (x,y,rad,tier=-1) => eachCell(x,y,rad, i => TALL[i] === 1 && (tier < 0 || TT[i] === tier));
function rustleAt(x,y,rad,amt){ eachCell(x,y,rad, i => { if (TALL[i]) RUST[i] = Math.min(1, RUST[i]+amt); }); }
function cutCircle(x,y,rad,tier=-1){
  let n = 0;
  eachCell(x,y,rad, i => { if (TALL[i] && (tier < 0 || TT[i] === tier)) { cutTuft(i,x,y); n++; } });
  return n;
}
function cutTuft(i,sx,sy){
  TALL[i] = 0; tallCount--;
  stampStubble(TX[i], TY[i]);
  let dx = TX[i]-sx, dy = TY[i]-sy; const d = Math.hypot(dx,dy) || 1; dx/=d; dy/=d;
  // the cut tuft topples over away from the blade
  if (G.falls.length < 180) G.falls.push({spr: GOLD[i] ? GOLDS[VAR[i]&1] : TUFTS[VAR[i]], x:TX[i], y:TY[i], dir: dx >= 0 ? 1 : -1, life:0, spd:rand(.8,1.2)});
  G.sheaves.push({x:TX[i], y:TY[i], z:20, vx:dx*rand(40,110)+rand(-20,20), vy:dy*rand(40,110)+rand(-20,20),
                  vz:rand(150,240), gold:GOLD[i]===1, t:0, landed:false, dead:false, eat:0, tier:TT[i]});
  if (G.parts.length < 400) for (let k=0; k<3; k++)
    G.parts.push({x:TX[i], y:TY[i], z:rand(10,40), vx:rand(-90,90), vy:rand(-60,60), vz:rand(60,200), life:0, max:rand(.4,.8), c:Math.random()<.5?'#f2cf63':'#c4a447'});
}

// ---- players ---------------------------------------------------------------
function join(input){
  if (G.players.length >= 4) return null;
  const slot = [0,1,2,3].find(s => !G.players.some(p => p.slot === s));
  const [x,y] = SPAWNS[slot];
  const p = {slot, col:COLORS[slot], input, x, y, vx:0, vy:0, fx:slot%2?-1:1, fy:0,
    mx:0, my:0, btn:false, prev:false, holding:false, holdT:0, charging:false, hasSickle:true,
    cd:0, slashT:0, score:0, dizzy:0, walk:0, squash:0, combo:0, comboT:0, inRice:false,
    connected:true, ai:null, catchT:0, hitBy:null, skid:0, lean:0, wasMoving:false,
    swing:0, lastSlash:-9, slashDur:.2, hop:0, full:false, z:0, vz:0, tier:tierAt(x, y), onStair:false, stairK:-1, stairX:0,
    st:newStats(), ping:false, pingPrev:false, pingT:0, pushT:0, wantUp:0, vault:null, ropeDrag:0, syncT:-9};

// ---- bots (CPU players, also used by the test hook) ---------------------------
function botThink(p, dt){
  const a = p.ai || (p.ai = {mx:0, my:0, b:false, tx:p.x, ty:p.y, think:0, mode:'walk', hold:0, throwCD:rand(2,4), ax:1, ay:0});
  a.think -= dt; a.throwCD -= dt;
  const rp = ropePartner(p);   // a partner who stands still for 2 s gets left to it
  a.pIdle = rp && Math.hypot(rp.vx, rp.vy) < 20 && !(rp.wantUp > 0) ? (a.pIdle || 0) + dt : 0;
  if (a.mode === 'aim') {
    a.hold -= dt; a.b = true; a.mx = a.ax*.3; a.my = a.ay*.3;
    if (a.hold <= 0) { a.b = false; a.mode = 'walk'; a.throwCD = rand(3, 6); }
    return;
  }
  if (a.think <= 0) {
    a.think = rand(.25, .45);
    let best = null, bd = 280*280;
    const far = t => t === p.tier ? 0 : 200*200;   // other tiers cost a detour
    for (const s of G.sheaves) { const d = (s.x-p.x)**2 + (s.y-p.y)**2 + far(s.tier); if (d < bd) { bd = d; best = s; } }
    if (best) { a.tx = best.x; a.ty = best.y; }
    else {
      let bi = -1, bdd = 1e12;
      const scanAll = tallCount < 120;   // near the end, sampling misses the last tufts
      for (let k=0; k<(scanAll ? N : 80); k++) { const i = scanAll ? k : (Math.random()*N)|0; if (!TALL[i]) continue; const d = (TX[i]-p.x)**2 + (TY[i]-p.y)**2 + far(TT[i]); if (d < bdd) { bdd = d; bi = i; } }
      if (bi >= 0) { a.tx = TX[bi]; a.ty = TY[bi]; } else { a.tx = rand(PADDY.x0, PADDY.x1); a.ty = rand(PADDY.y0, PADDY.y1); }
    }
    // co-op: walk beside your partner (a human, or the CPU with the lower number) so the rope sweeps
    const q = ropePartner(p);
    if (q && (q.input.type !== 'bot' || q.slot < p.slot) && !(best && bd < 90*90) && a.pIdle < 2) {
      if (q.wantUp > .25 && WALLS.length && q.tier > 0) {   // they're stuck at a wall: go and be the step
        const k = q.tier - 1, sd = p.x > q.x ? 1 : -1;
        if (p.tier === q.tier) { a.tx = q.x + sd*30; a.ty = wallBot(k, q.x) + 14; }
        else { a.tx = q.x; a.ty = wallTop(k, q.x) - 12; }
      } else {
        let s = a.side || (a.side = p.slot % 2 ? 1 : -1);
        const at = sd => [q.x - q.fy*sd*230 + q.fx*30, q.y + q.fx*sd*230 + q.fy*30];
        let [tx, ty] = at(s);
        if (tx < PADDY.x0 + 20 || tx > PADDY.x1 - 20 || ty < PADDY.y0 + 10 || ty > PADDY.y1 - 10) { a.side = s = -s; [tx, ty] = at(s); }
        tx = clamp(tx, PADDY.x0 + 20, PADDY.x1 - 20);
        const [lo, hi] = tierBounds(q.tier, tx);
        a.tx = tx; a.ty = clamp(ty, lo + 8, hi - 8);
      }
    }
    if (p.hasSickle && a.throwCD <= 0) {
      let dir = null, bestN = 0;
      for (let k=0; k<8; k++) {
        const ang = k*Math.PI/4 + rand(-.2,.2), dx = Math.cos(ang), dy = Math.sin(ang); let n = 0;
        for (let s=40; s<=440; s+=40) if (tallNear(p.x+dx*s, p.y+dy*s, 22)) n++;
        if (n > bestN) { bestN = n; dir = [dx, dy]; }
      }
      if (bestN >= 6) { a.mode = 'aim'; a.ax = dir[0]; a.ay = dir[1]; a.hold = HOLD_MIN + rand(.35, .9); a.b = false; return; }
      a.throwCD = 1.5;
    }
  }
  const [wx, wy] = botWaypoint(p, a.tx, a.ty);
  const dx = wx - p.x, dy = wy - p.y, d = Math.hypot(dx, dy);
  if (d > 6) { a.mx = dx/d; a.my = dy/d; } else { a.mx = a.my = 0; }
  // stuck on a wall or a corner: wander somewhere else on this tier for a moment
  const moved = Math.hypot(p.x - (a.lx ?? p.x), p.y - (a.ly ?? p.y)); a.lx = p.x; a.ly = p.y;
  a.stuck = d > 20 && moved < 30*dt ? (a.stuck || 0) + dt : 0;
  if (a.stuck > .7) { a.stuck = 0; a.tx = clamp(p.x + rand(-300, 300), PADDY.x0+20, PADDY.x1-20); const [lo, hi] = tierBounds(p.tier, a.tx); a.ty = rand(lo, hi); a.think = 1.2; }
  a.b = p.hasSickle && p.cd <= 0 && !p.prev && tallNear(p.x + p.fx*10, p.y + p.fy*8, SLASH_R - 14, p.onStair ? -1 : p.tier);
}
// terraces: CPUs hop down toward a lower target and walk to the nearest stairs for a higher one
function botWaypoint(p, tx, ty){
  if (!WALLS.length || p.z > 0) return [tx, ty];
  const tt = tierAt(tx, ty);
  if (p.onStair) {
    const k = p.stairK;
    return tt <= k ? [p.stairX, wallTop(k, p.stairX) - 26] : [p.stairX, wallBot(k, p.stairX) + 26];
  }
  if (tt === p.tier) return [tx, ty];
  if (tt > p.tier) { const x = p.x + clamp(tx - p.x, -50, 50); return [x, wallBot(p.tier, x) + 30]; }
  const k = p.tier - 1; let sx = 0, bd = 1e9;

  if (Math.abs(p.x - sx) < STAIR_W/2 - 12) return [sx, wallTop(k, sx) - 26];   // lined up: climb

}

// ---- input -------------------------------------------------------------------
const keys = new Set();
const KEYSETS = {
  A: {u:'KeyW', d:'KeyS', l:'KeyA', r:'KeyD', b:['Space'], ping:'KeyE'},
  B: {u:'ArrowUp', d:'ArrowDown', l:'ArrowLeft', r:'ArrowRight', b:['Enter','NumpadEnter','ShiftRight'], ping:'Slash'},

const ACTION_BTNS = [0,1,2], PING_BTN = 3;
addEventListener('keydown', e => {
  unlockAudio(); wake();
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  const c = e.code;
  if (G.state === 'paused') {
    if (c === 'ArrowUp' || c === 'KeyW') return menuMove(-1);
    if (c === 'ArrowDown' || c === 'KeyS') return menuMove(1);
    if (c === 'Space' || c === 'Enter' || c === 'NumpadEnter') return menuChoose();
    if (c === 'Backspace') return pause(false);
  }
  if (c === 'KeyF') toggleFullscreen();
  else if (c === 'KeyG') startPressed();
  else if (c === 'KeyP' || c === 'Escape') { if (G.state === 'play') pause(true); else if (G.state === 'paused') pause(false); }
  else if (c === 'KeyC') addBot();
  else if (c === 'KeyT') switchLevel(1);
  else if (c === 'KeyO') switchMode();
  else if (c === 'KeyQ') { if (G.state === 'paused' || G.state === 'end') toLobby(); }
  else if (c === 'KeyM') { muted = !muted; if (windGain) windGain.gain.value = muted ? 0 : .025; toast(muted ? 'Sound off (M)' : 'Sound on'); }
  else if (canJoinNow()) {
    for (const set of ['A','B']) if (KEYSETS[set].b.includes(c) && !G.players.some(p => p.input.type === 'key' && p.input.set === set)) {
      const p = join({type:'key', set}); if (p) p.prev = true;
    }
  }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
addEventListener('gamepadconnected', e => toast(`Controller ${e.gamepad.index+1} found: press A to join`));
addEventListener('gamepaddisconnected', e => toast(`Controller ${e.gamepad.index+1} disconnected`));

const padPrev = {}, padAxisPrev = {};
function pollPads(){
  let pads = [];
  try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch(e) {}
  G.padsSeen = [];
  for (const pad of pads) {
    if (!pad) continue;
    G.padsSeen.push(pad);
    const prev = padPrev[pad.index] || [];
    const now = pad.buttons.map(b => b.pressed || b.value > .5);
    const edge = i => now[i] && !prev[i];
    const owner = G.players.find(p => p.input.type === 'pad' && p.input.index === pad.index);
    if (now.some((v,i) => v && !prev[i])) wake();
    // stick as menu up/down (edge-triggered like a button)
    const ay = pad.axes[1] || 0, dir = ay < -.6 ? -1 : ay > .6 ? 1 : 0;
    const stickEdge = dir !== 0 && dir !== (padAxisPrev[pad.index] || 0);
    padAxisPrev[pad.index] = dir;
    if (G.state === 'paused') {
      if (edge(12) || (stickEdge && dir < 0)) menuMove(-1);
      else if (edge(13) || (stickEdge && dir > 0)) menuMove(1);
      else if (edge(0)) menuChoose();
      else if (edge(1)) pause(false);          // B closes the menu
      else if (edge(9)) pause(false);
      else if (edge(8)) toLobby();
      padPrev[pad.index] = now;
      continue;
    }
    if (edge(9)) startPressed();
    if (edge(8)) backPressed();
    if (edge(4)) switchLevel(-1);
    if (edge(5)) switchLevel(1);
    if (edge(6) || edge(7)) switchMode();
    if (!owner && canJoinNow() && ACTION_BTNS.some(edge)) {
      const p = join({type:'pad', index:pad.index, id:pad.id});
      if (p) p.prev = true;   // the join press is not also a swing
    }
    padPrev[pad.index] = now;
  }

}
function readInput(p, pads, dt){
  const inp = p.input; let mx = 0, my = 0, b = false, ping = false;
  if (inp.type === 'pad') {
    const pad = pads[inp.index];
    p.connected = !!(pad && pad.connected);
    if (pad) {
      let ax = pad.axes[0] || 0, ay = pad.axes[1] || 0; const m = Math.hypot(ax, ay);
      if (m < .22) { ax = ay = 0; } else { const k = Math.min(1, (m-.22)/.68)/m; ax *= k; ay *= k; }
      const B = i => pad.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > .5);
      if (B(14)) ax = -1; if (B(15)) ax = 1; if (B(12)) ay = -1; if (B(13)) ay = 1;
      mx = ax; my = ay; b = ACTION_BTNS.some(B); ping = B(PING_BTN);
    }
  } else if (inp.type === 'key') {
    const s = KEYSETS[inp.set];
    mx = (keys.has(s.r)?1:0) - (keys.has(s.l)?1:0); my = (keys.has(s.d)?1:0) - (keys.has(s.u)?1:0);
    b = s.b.some(k => keys.has(k)); ping = keys.has(s.ping);
  } else { botThink(p, dt); mx = p.ai.mx; my = p.ai.my; b = p.ai.b; }

function rumble(p, ms, strong, weak){
  if (p.input.type !== 'pad') return;

    if (va && va.playEffect) va.playEffect('dual-rumble', {duration:ms, strongMagnitude:strong, weakMagnitude:weak}).catch(()=>{});
  } catch(e) {}
}

function startPressed(){

  else if (G.state === 'play') pause(true);
  else if (G.state === 'paused') pause(false);
  else if (G.state === 'end' && G.endT > 1.2) beginRound();
}

  if (G.state === 'lobby') addBot();

}
function addBot(){
  if (G.state !== 'lobby') return;
  if (G.players.length < 4) join({type:'bot'});
  else if (G.players.some(p => p.input.type === 'bot')) { G.players = G.players.filter(p => p.input.type !== 'bot'); toast('CPUs removed'); }
}
function switchLevel(d){

}

  resetWorld();
  toast(COOP ? 'Mode: Co-op (one basket for everyone)' : 'Mode: Race (most rice wins)');
  tone(COOP ? 784 : 660, .06, 'triangle', .07); tone(COOP ? 1175 : 990, .08, 'triangle', .07, null, .05);
}

  G.rings = []; G.team = 0; G.lostDuck = 0; G.lostRain = 0; G.storm = {phase:'none', x:-99, t:0, drip:0};

// co-op targets: a share of all the rice in the field (a lower bar when you play alone)
function starT(){ const n = G.roundPlayers; return (n >= 3 ? STARS_CREW : n === 2 ? STARS_DUO : STARS_SOLO).map(f => Math.round(G.maxValue*f)); }
// the storm: a warning, then a band of rain sweeps across and soaks any sheaf left lying in it
// a bigger crew clears the field sooner, so their storm comes sooner too
const stormAt = () => STORM_AT - Math.max(0, G.roundPlayers - 2)*8;
function updateStorm(dt){
  const st = G.storm;
  if (st.phase === 'none' && G.clock >= stormAt() - 5) {
    st.phase = 'warn'; toast('A storm is coming! Pick up the sheaves.'); sfxThunder();
  } else if (st.phase === 'warn' && G.clock >= stormAt()) {
    st.phase = 'rain'; st.x = -20; sfxThunder();
  } else if (st.phase === 'rain') {
    st.x += STORM_SPEED*dt;
    if (st.x - STORM_W > W) st.phase = 'done';
    st.drip -= dt; if (st.drip <= 0) { st.drip = .08; noise(.14, 5200, 3000, .025, .8); }
    for (const s of G.sheaves) {

      if (s.wet >= SOAK) {

}
// how dark the storm makes things (0..1)
function stormDark(){

  ctx.globalAlpha = 1;
  for (const b of G.booms) drawBoom(b);
  for (const p of G.players) if (p.charging && p.hasSickle) drawAim(p);
  drawStorm(t);
  // evening light
  if (f > .6) {
    base();
    const warm = clamp((f-.6)/.2, 0, 1)*(1 - clamp((f-.85)/.15, 0, 1));
    if (warm > 0) { ctx.fillStyle = `rgba(255,150,60,${.12*warm})`; ctx.fillRect(0, SKY_H, W, H-SKY_H); }
    const dusk = clamp((f-.8)/.2, 0, 1);
    if (dusk > 0) {
      ctx.fillStyle = `rgba(40,30,90,${.34*dusk})`; ctx.fillRect(0, SKY_H, W, H-SKY_H);
      for (let k=0; k<26; k++) {
        const fx = (k*173.3 + Math.sin(t*.4 + k)*60) % W, fy = SKY_H + 40 + ((k*97.1 + Math.cos(t*.5 + k*2)*40) % (H-SKY_H-60));
        ctx.fillStyle = `rgba(255,250,170,${dusk*(.4 + .4*Math.sin(t*3 + k))})`; ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, 7); ctx.fill();
      }
    }
  }
  for (const p of G.players) drawMarker(p);
  OX = OX0; OY = OY0;   // HUD and panels don't shake
  base();
  for (const tx of G.texts) { ctx.globalAlpha = 1 - tx.life; txt(tx.txt, tx.x, tx.y - tx.life*30, tx.size, tx.col, 'center', 4); }
  ctx.globalAlpha = 1;
  drawHUD();
  if (G.state === 'lobby') drawLobby();
  else if (G.state === 'count') {
    const n = 3 - Math.floor(G.countT/(COUNT/3));
    txt(String(Math.max(1, n)), W/2, H/2 + 20, 120, '#ffe7a0', 'center', 12, 900);
    txt('Get ready', W/2, H/2 - 70, 30, '#fff', 'center', 6, 800);
  } else if (G.state === 'play') {
    if (G.goT < .9) { base(); ctx.globalAlpha = 1 - G.goT/.9; txt('Harvest!', W/2, H/2, 110, '#ffe7a0', 'center', 12, 900); ctx.globalAlpha = 1; }
    const left = ROUND - G.clock;
    if (left <= 5 && left > 0) { base(); txt(String(Math.ceil(left)), W/2, SKY_H + 70, 70, '#fff0c0', 'center', 10, 900); }
  } else if (G.state === 'paused') drawPauseMenu();
  else if (G.state === 'end') drawEnd();
  if (G.toast) {
    base(); const a = clamp(Math.min(G.toast.t/.15, (2.6 - G.toast.t)/.4), 0, 1);
    ctx.globalAlpha = a; ctx.font = `700 18px ${FONT}`; const tw = ctx.measureText(G.toast.msg).width + 40;
    ctx.fillStyle = 'rgba(40,26,16,.85)'; rr(ctx, W/2 - tw/2, SKY_H + 10, tw, 38, 19); ctx.fill();
    txt(G.toast.msg, W/2, SKY_H + 29, 18, '#fff3dc', 'center', 0, 700); ctx.globalAlpha = 1;
  }
}

// ---- audio (Web Audio, starts after a click or key; paused while the tab is hidden) ----
let AC = null, master = null, noiseBuf = null, windGain = null, muted = false, lastPick = 0;
function unlockAudio(){
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i=0; i<d.length; i++) d[i] = Math.random()*2 - 1;
      const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      windGain = AC.createGain(); windGain.gain.value = muted ? 0 : .025;
      src.connect(lp).connect(windGain).connect(master); src.start();
    }
    if (AC.state === 'suspended' && !document.hidden) AC.resume();
  } catch(e) {}
}
addEventListener('pointerdown', () => { unlockAudio(); wake(); });
const live = () => AC && AC.state === 'running' && !muted;
function tone(freq, dur, type='sine', vol=.2, slideTo=null, delay=0){
  if (!live()) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.03);
}
function noise(dur, f0, f1, vol=.2, q=1.2, delay=0){
  if (!live()) return;
  const t = AC.currentTime + delay, src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = q;
  bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t+dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  src.connect(bp).connect(g).connect(master); src.start(t, Math.random()); src.stop(t+dur+.03);
}
const sfxSlash = (n, swing=0) => {
  noise(swing === 2 ? .26 : .14, 3000 + swing*500, 650, swing === 2 ? .2 : .16);
  if (n) { sfxCrunch(n); if (n >= 6) tone(140 - swing*15, .1, 'sine', .14, 55); }
};
const sfxCrunch = n => { noise(.09, rand(4600, 5600), 2300, .05 + Math.min(n, 15)*.006, 2); if (n > 3) noise(.06, 7000, 4000, .03, 3, .03); };
const sfxSkid = () => noise(.16, 1100, 450, .07, 1.5);
const sfxThrow = ch => noise(.35, 600, 2400 + ch*1200, .14, 2);
const sfxTink = () => tone(1800, .06, 'triangle', .06);
const sfxCatch = () => { tone(1320, .08, 'triangle', .1); tone(1980, .1, 'sine', .07, null, .03); };
const sfxBonk = () => tone(240, .2, 'square', .07, 80);
const sfxHop = () => tone(520, .09, 'triangle', .06, 780);
const sfxThunder = () => { noise(1.4, 260, 50, .3, .7); noise(.5, 900, 120, .12, .9, .08); tone(55, 1, 'sine', .12, 38); };
const sfxThud = () => { tone(130, .14, 'sine', .16, 55); noise(.08, 900, 300, .07, 1.2); };
const sfxJoin = () => { tone(784, .08, 'triangle', .1); tone(1175, .14, 'triangle', .1, null, .07); };
const sfxQuack = () => { tone(430, .13, 'sawtooth', .045, 250); tone(415, .1, 'sawtooth', .03, 260, .15); };
function sfxPick(combo, gold){
  if (!live()) return;
  const now = AC.currentTime; if (now - lastPick < .025) return; lastPick = now;
  const scale = [0,2,4,7,9], st = Math.min(combo-1, 14), semis = scale[st%5] + 12*Math.floor(st/5);
  tone(523.25*2**(semis/12), .07, 'sine', .08);
  if (gold) [0,4,7,12].forEach((s, i) => tone(784*2**(s/12), .12, 'triangle', .08, null, i*.06));
}
function sfxFanfare(){ [0,4,7,12,16].forEach((s, i) => tone(523.25*2**(s/12), .3, 'triangle', .1, null, i*.11)); }
function gustSound(){
  if (!live() || !windGain) return;
  const t = AC.currentTime;
  windGain.gain.cancelScheduledValues(t); windGain.gain.setValueAtTime(windGain.gain.value, t);
  windGain.gain.linearRampToValueAtTime(.07, t+1.2); windGain.gain.linearRampToValueAtTime(.025, t+3.5);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (G.state === 'play') pause(true); if (AC) AC.suspend(); }
  else if (AC) AC.resume();
});

// ---- full screen, idle cursor -----------------------------------------------------
const fsBtn = document.getElementById('fs');
function toggleFullscreen(){
  unlockAudio();
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen().catch(()=>{});
}
fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFullscreen(); });
let idleT = 0;
function wake(){ idleT = 0; document.body.classList.remove('idle'); }
addEventListener('pointermove', wake);

// ---- loop + test hook ---------------------------------------------------------------
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if (cv.width !== Math.round(innerWidth*Math.min(2, devicePixelRatio || 1))) resize();
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  idleT += dt; if (idleT > 3) document.body.classList.add('idle');
  if (!G.manual) update(dt);
  draw();
}
resize(); toLobby();
requestAnimationFrame(frame);

window.__harvest = {
  G, N, get tall(){ return tallCount; },
  join, addBot, start: beginRound, lobby: toLobby, startPressed, switchLevel, switchMode, tierAt, wallTop, wallBot,
  get level(){ return LV.id; }, get walls(){ return WALLS; }, get coop(){ return COOP; }, ropePairs, starT, endRound,
  manual(on){ G.manual = !!on; },
  step(n=1){ for (let k=0; k<n; k++) update(1/60); draw(); },
};
