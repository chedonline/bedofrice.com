<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bed of Rice · kitchen toy</title>
<style>
html,body{margin:0;height:100%;background:#2F3B5C;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
</style></head><body><canvas id="c"></canvas><script>
'use strict';
// Bed of Rice: a cozy one-button kitchen toy (Sushi Ladder, kaiten shift). Grey-box prototype.
// One button: tap = pick up / put down / serve, hold = work a station, tap with nothing in reach = dash (empty) or throw (carrying).
const cv=document.getElementById('c'),g=cv.getContext('2d');
const T=60,COLS=21,ROWS=11,HUD=60,W=1260,H=720,PR=20;
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;
// --- tuning (cozy: slow and forgiving) ---
const SPEED=185,DAY=240,COOK=6,OKOGE=12,SLICE=1.4,STEP=0.6,PATIENCE=100;
const MAP=[
"#C#C#R##S#T#E##PP#XO#",
"#...................#",
"#...................#",
"#....#BB#...#BB#....#",
"#...................#",
"#...................#",
"#...#####...#####...#",
"#...................#",
"#===================#",
"#===================#",
"#h h h h h h h h h h#"];
const COL={bg:'#F5EADB',bg2:'#EEDFC8',wood:'#E8C795',woodD:'#C99E64',noren:'#2F3B5C',rice:'#FFFDF8',salmon:'#F7996F',tuna:'#D8475B',egg:'#F6C845',gold:'#F2B53C',belt:'#3A4566',beltL:'#56628A',ink:'#3B2E25',bar:'#B98B58'};
const PCOL=['#EF5F93','#22A396','#E0A21F','#5F93D6'];
const FISH={S:'salmon',T:'tuna',E:'egg'},FNAME={salmon:'salmon',tuna:'tuna',egg:'tamago'};
const TOPCOL={salmon:COL.salmon,tuna:COL.tuna,egg:COL.egg};
const ORDERS=['salmon','salmon','tuna','egg'];
const CUSTCOL=['#F4C7B8','#CDE3C6','#C8D7EE','#EAD3EE','#F6E2B3','#D9E8E4'];
const tile=(c,r)=>(r<0||r>=ROWS||c<0||c>=COLS)?'#':MAP[r][c];
const walk=(c,r)=>tile(c,r)==='.';
const K=(c,r)=>c+','+r;
const path=[];for(let c=1;c<=19;c++)path.push([c,8]);for(let c=19;c>=1;c--)path.push([c,9]);
const N=path.length,beltIdx={};path.forEach(([c,r],j)=>beltIdx[K(c,r)]=j);
const SPAWN=[[3,4],[17,4],[3,1],[17,1]];

let state='lobby',paused=false,time=0,tips=0,spawnT=2,offset=0,beltT=0,stepCount=0,endT=0,clock=0,fdt=0,hintT=0;
let hold={},cookers={},belt=new Array(N).fill(null),floor=[],projs=[],floats=[],seats=[],players=[],stats={};
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=MAP[r][c];if(t==='C')cookers[K(c,r)]={state:'empty',t:0,okoge:false,by:null};if(t==='h')seats.push({c,r,cust:null});}

function reset(){hold={};for(const k in cookers)Object.assign(cookers[k],{state:'empty',t:0,okoge:false,by:null});
  belt=new Array(N).fill(null);floor=[];projs=[];seats.forEach(s=>s.cust=null);tips=0;time=0;spawnT=2;
  stats={served:0,handoffs:0,okoge:0,sleepy:0};players.forEach((p,i)=>placePlayer(p,i));}
function placePlayer(p,i){const[c,r]=SPAWN[i%4];p.x=c*T+T/2;p.y=r*T+T/2;p.carry=null;p.working=false;p.dashT=0;p.dashCd=0;p.face=[0,1];p.dir=[0,1];p.nope=0;}
function stars(){const n=Math.max(1,players.length),m=1+0.6*(n-1);return[150,300,450].map(v=>Math.round(v*m/10)*10);}

// --- audio (soft, only while visible) ---
let ac=null;
function audio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended'&&!document.hidden)ac.resume();}catch(e){}}
function tone(f,d,type='sine',v=.1,slide=0,delay=0){if(!ac||document.hidden||ac.state!=='running')return;const t0=ac.currentTime+delay,o=ac.createOscillator(),gn=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+d);
  gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(v,t0+.01);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn).connect(ac.destination);o.start(t0);o.stop(t0+d+.02);}
const SFX={pick:()=>tone(620,.09,'triangle',.07,1.25),drop:()=>tone(300,.12,'triangle',.09,.8),nope:()=>tone(150,.1,'sine',.06,.8),
  dash:()=>tone(420,.16,'sine',.04,.5),chop:()=>tone(880,.035,'triangle',.035),sliced:()=>{tone(660,.1,'triangle',.07);tone(990,.14,'triangle',.07,0,.07)},
  ready:()=>{tone(1180,.35,'sine',.04,1.06)},okoge:()=>{tone(520,.12,'triangle',.05);tone(780,.18,'triangle',.05,0,.09)},
  serve:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.07,0,i*.07)),toss:()=>tone(380,.16,'sine',.05,1.7),catch:()=>tone(840,.1,'triangle',.07,1.2),
  sleepy:()=>tone(330,.6,'sine',.04,.6),join:()=>{tone(587,.12,'triangle',.07);tone(880,.16,'triangle',.07,0,.08)},open:()=>[392,523,659,784].forEach((f,i)=>tone(f,.3,'triangle',.06,0,i*.11)),
  close:()=>[784,659,523,392].forEach((f,i)=>tone(f,.35,'triangle',.06,0,i*.14))};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')paused=true;if(ac)ac.suspend();}});
function rumble(p,ms=80,s=.25,w=.5){if(!p||p.src.type!=='pad')return;const gp=navigator.getGamepads()[p.src.index],va=gp&&gp.vibrationActuator;
  if(va&&va.playEffect)va.playEffect('dual-rumble',{duration:ms,strongMagnitude:s,weakMagnitude:w}).catch(()=>{});}

// --- input sources: 2 keyboard sets, 4 pads, touch ---
const keys=new Set();
addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();audio();
  if(e.code==='Escape'&&state==='play')paused=!paused;});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
const touch={mx:0,my:0,btn:false,id:null,bid:null,sx:0,sy:0,cx:0,cy:0};
function toCanvas(t){const r=cv.getBoundingClientRect();return[(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height];}
cv.addEventListener('touchstart',e=>{e.preventDefault();audio();for(const t of e.changedTouches){const[x,y]=toCanvas(t);
  if(x<W/2&&touch.id===null){touch.id=t.identifier;touch.sx=touch.cx=x;touch.sy=touch.cy=y;}else if(x>=W/2&&touch.bid===null){touch.bid=t.identifier;touch.btn=true;}}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==touch.id)continue;const[x,y]=toCanvas(t);
  let dx=(x-touch.sx)/55,dy=(y-touch.sy)/55;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}touch.mx=m<.2?0:dx;touch.my=m<.2?0:dy;touch.cx=touch.sx+dx*55;touch.cy=touch.sy+dy*55;}},{passive:false});
function tend(e){for(const t of e.changedTouches){if(t.identifier===touch.id){touch.id=null;touch.mx=touch.my=0;}if(t.identifier===touch.bid){touch.bid=null;touch.btn=false;}}}
cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
const SOURCES=[{key:'kb1',type:'kb',set:1},{key:'kb2',type:'kb',set:2},{key:'pad0',type:'pad',index:0},{key:'pad1',type:'pad',index:1},{key:'pad2',type:'pad',index:2},{key:'pad3',type:'pad',index:3},{key:'touch',type:'touch'}];
const KB={1:{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',b:['Space','KeyE']},2:{u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',b:['Enter','ShiftRight','Slash']}};
function readSrc(src){
  if(src.type==='kb'){const s=KB[src.set];return{mx:(keys.has(s.r)?1:0)-(keys.has(s.l)?1:0),my:(keys.has(s.d)?1:0)-(keys.has(s.u)?1:0),btn:s.b.some(k=>keys.has(k)),start:false};}
  if(src.type==='pad'){const gp=(navigator.getGamepads?navigator.getGamepads():[])[src.index];if(!gp)return{mx:0,my:0,btn:false,start:false};
    let mx=gp.axes[0]||0,my=gp.axes[1]||0;if(Math.hypot(mx,my)<.25){mx=0;my=0;}const b=i=>gp.buttons[i]&&gp.buttons[i].pressed;
    if(b(12))my=-1;if(b(13))my=1;if(b(14))mx=-1;if(b(15))mx=1;return{mx,my,btn:b(0)||b(1)||b(2)||b(3),start:b(9)};}
  return{mx:touch.mx,my:touch.my,btn:touch.btn,start:false};}
const srcPrev={},startPrev={};
function pollSources(){for(const s of SOURCES){const i=readSrc(s),edge=i.btn&&!srcPrev[s.key],sEdge=i.start&&!startPrev[s.key];srcPrev[s.key]=i.btn;startPrev[s.key]=i.start;
  const p=players.find(p=>p.src.key===s.key);
  if(!p&&edge&&players.length<4&&state!=='end'){const np={id:players.length,src:s,prev:true};players.push(np);placePlayer(np,np.id);SFX.join();rumble(np,120,.3,.6);
    addFloat(np.x,np.y-40,(np.id+1)+'P joined!',PCOL[np.id]);}
  if(p&&sEdge){if(state==='lobby')openShop();else if(state==='play')paused=!paused;}}}

// --- helpers ---
function addFloat(x,y,text,col='#3B2E25',size=18){floats.push({x,y,text,col,size,t:0});}
function slotAt(c,r){const j=beltIdx[K(c,r)];return j===undefined?-1:((j-offset)%N+N)%N;}
function target(p){return[Math.floor(p.x/T)+p.face[0],Math.floor(p.y/T)+p.face[1]];}
const isComplete=it=>it&&it.t==='plate'&&it.rice&&it.top;
function newPlate(p){return{t:'plate',rice:null,top:null,by:new Set([p.id]),pop:1};}
function combine(a,b){const p=a.t==='plate'?a:b.t==='plate'?b:null;if(!p)return null;const o=p===a?b:a;if(o.t==='plate')return null;
  if(o.t==='rice'&&!p.rice){p.rice={okoge:o.okoge};o.by.forEach(x=>p.by.add(x));p.pop=1;return p;}
  if(o.t==='fish'&&o.sliced&&!p.top){p.top=o.f;o.by.forEach(x=>p.by.add(x));p.pop=1;return p;}
  return null;}
function startCook(k,p){Object.assign(cookers[k],{state:'cooking',t:0,okoge:false,by:p.id});}
function nope(p){p.nope=.25;SFX.nope();}
function openShop(){state='play';paused=false;reset();SFX.open();addFloat(W/2,4*T,"We're open!",'#2F3B5C',30);hintT=0;}

// --- the one button ---
function press(p){
  const[tc,tr]=target(p),k=K(tc,tr),ty=tile(tc,tr);
  if(ty==='O'){if(state==='lobby'){openShop();return;}addFloat(tc*T+30,tr*T+10,state==='play'?'Open till 9 PM':'Closed','#2F3B5C');return;}
  if(!p.carry){
    const fx=p.x+p.face[0]*30,fy=p.y+p.face[1]*30;let best=-1,bd=44;
    floor.forEach((f,i)=>{const d=Math.min(Math.hypot(f.x-fx,f.y-fy),Math.hypot(f.x-p.x,f.y-p.y));if(d<bd){bd=d;best=i;}});
    if(best>=0){p.carry=floor[best].it;floor.splice(best,1);p.carry.pop=1;SFX.pick();return;}
    if(ty==='B'){const it=hold[k];if(it&&it.t==='fish'&&!it.sliced){p.working=true;return;}}
    if(ty==='='){const s=slotAt(tc,tr);if(belt[s]){p.carry=belt[s];belt[s]=null;p.carry.pop=1;SFX.pick();return;}}
    if(hold[k]){p.carry=hold[k];delete hold[k];p.carry.pop=1;SFX.pick();return;}
    if(ty==='R'){p.carry={t:'raw',pop:1};SFX.pick();return;}
    if(FISH[ty]){p.carry={t:'fish',f:FISH[ty],prog:0,sliced:false,by:new Set(),pop:1};SFX.pick();return;}
    if(ty==='P'){p.carry=newPlate(p);SFX.pick();return;}
    if(ty==='C'){const ck=cookers[k];if(ck.state==='ready'){p.carry={t:'rice',okoge:ck.okoge,by:new Set([ck.by,p.id]),pop:1};ck.state='empty';SFX.pick();return;}return nope(p);}
    if(walk(tc,tr)||ty==='='){if(p.dashCd<=0){p.dashT=.17;p.dashCd=.55;SFX.dash();}return;}
    return nope(p);
  }
  const c=p.carry;
  if(ty==='X'){p.carry=null;SFX.drop();addFloat(tc*T+30,tr*T+8,'into the bin','#6b7177',14);return;}
  if(ty==='C'){const ck=cookers[k];
    if(c.t==='raw'&&ck.state==='empty'){startCook(k,p);p.carry=null;SFX.drop();return;}
    if(c.t==='plate'&&!c.rice&&ck.state==='ready'){c.rice={okoge:ck.okoge};c.by.add(ck.by);c.by.add(p.id);c.pop=1;ck.state='empty';SFX.pick();return;}
    return nope(p);}
  if(ty==='B'||ty==='#'||ty==='='){
    const onBelt=ty==='=',s=onBelt?slotAt(tc,tr):-1,it=onBelt?belt[s]:hold[k];
    const put=v=>{if(onBelt){belt[s]=v;if(v)v.beltStep=stepCount;}else if(v)hold[k]=v;else delete hold[k];};
    if(!it){if(ty==='B'&&c.t!=='fish')return nope(p);put(c);c.pop=1;p.carry=null;SFX.drop();return;}
    const m=combine(c,it);if(!m)return nope(p);
    if(m===c){put(null);p.carry=c;}else{put(m);p.carry=null;}SFX.drop();return;}
  if(walk(tc,tr)){toss(p);return;}
  nope(p);}
function toss(p){const it=p.carry;p.carry=null;const d=p.dir;
  projs.push({it,x:p.x+d[0]*22,y:p.y+d[1]*22,vx:d[0]*540,vy:d[1]*540,dist:0,from:p,lx:p.x,ly:p.y});SFX.toss();rumble(p,40,.1,.3);}
function land(pr,c,r){const ty=tile(c,r),k=K(c,r),it=pr.it;let ok=false;
  if(ty==='#'){if(!hold[k]){hold[k]=it;ok=true;}else{const m=combine(it,hold[k]);if(m){hold[k]=m;ok=true;}}}
  else if(ty==='='){const s=slotAt(c,r);if(!belt[s]){belt[s]=it;it.beltStep=stepCount;ok=true;}else{const m=combine(it,belt[s]);if(m){belt[s]=m;m.beltStep=stepCount;ok=true;}}}
  else if(ty==='B'&&!hold[k]&&it.t==='fish'){hold[k]=it;ok=true;}
  else if(ty==='C'&&it.t==='raw'&&cookers[k].state==='empty'){startCook(k,pr.from);ok=true;}
  else if(ty==='X'){ok=true;}
  if(ok){it.pop=1;SFX.drop();addFloat(c*T+30,r*T+6,ty==='X'?'in the bin!':'swish!','#2F3B5C',15);}
  else{floor.push({it,x:pr.lx,y:pr.ly});it.pop=1;SFX.drop();}}

// --- simulation ---
function moveP(p,dx,dy){p.x+=dx;collide(p);p.y+=dy;collide(p);}
function collide(p){const R=PR,c0=Math.floor((p.x-R)/T),c1=Math.floor((p.x+R)/T),r0=Math.floor((p.y-R)/T),r1=Math.floor((p.y+R)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){if(walk(c,r))continue;
    const nx=Math.max(c*T,Math.min(p.x,c*T+T)),ny=Math.max(r*T,Math.min(p.y,r*T+T)),dx=p.x-nx,dy=p.y-ny,d=Math.hypot(dx,dy);
    if(d<R&&d>1e-4){p.x+=dx/d*(R-d);p.y+=dy/d*(R-d);}}}
function updatePlayers(dt){
  for(const p of players){const inp=readSrc(p.src),edge=inp.btn&&!p.prev;p.prev=inp.btn;
    let mx=inp.mx,my=inp.my;const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}
    if(m>.35){p.face=Math.abs(mx)>Math.abs(my)?[Math.sign(mx),0]:[0,Math.sign(my)];p.dir=[mx/Math.max(m,1e-4),my/Math.max(m,1e-4)];}
    p.dashCd-=dt;p.nope=Math.max(0,p.nope-dt);
    if(edge&&state!=='end')press(p);
    if(p.working){const[c,r]=target(p),it=hold[K(c,r)];
      if(!inp.btn||tile(c,r)!=='B'||!it||it.t!=='fish'||it.sliced){p.working=false;}
      else{it.prog+=dt/SLICE;p.chopT=(p.chopT||0)+dt;if(p.chopT>.2){p.chopT=0;SFX.chop();it.pop=.35;}
        if(it.prog>=1){it.sliced=true;it.by.add(p.id);p.working=false;SFX.sliced();rumble(p,70,.1,.45);addFloat(c*T+30,r*T+4,'sliced!','#8a5a2b',16);}}}
    let sp=p.working?0:SPEED;
    if(p.dashT>0){p.dashT-=dt;sp=SPEED*2.6;mx=p.dir[0];my=p.dir[1];}
    moveP(p,mx*sp*dt,my*sp*dt);}
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<PR*2&&d>1e-4){const o=(PR*2-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o;collide(a);collide(b);}}}
function updateProjs(dt){for(const pr of projs){const sx=pr.vx*dt,sy=pr.vy*dt;pr.x+=sx;pr.y+=sy;pr.dist+=Math.hypot(sx,sy);
    for(const q of players){if(q!==pr.from&&!q.carry&&Math.hypot(q.x-pr.x,q.y-pr.y)<34){q.carry=pr.it;pr.it.pop=1;pr.done=true;SFX.catch();rumble(q,90,.2,.6);addFloat(q.x,q.y-44,'nice catch!',PCOL[q.id],16);break;}}
    if(pr.done)continue;const c=Math.floor(pr.x/T),r=Math.floor(pr.y/T);
    if(!walk(c,r)){land(pr,c,r);pr.done=true;continue;}pr.lx=pr.x;pr.ly=pr.y;
    if(pr.dist>250){floor.push({it:pr.it,x:pr.x,y:pr.y});pr.it.pop=1;SFX.drop();pr.done=true;}}
  projs=projs.filter(p=>!p.done);}
function updateCookers(dt){for(const k in cookers){const ck=cookers[k];
  if(ck.state==='cooking'){ck.t+=dt;if(ck.t>=COOK){ck.state='ready';ck.t=0;SFX.ready();}}
  else if(ck.state==='ready'){ck.t+=dt;if(!ck.okoge&&ck.t>=OKOGE){ck.okoge=true;SFX.okoge();const[c,r]=k.split(',').map(Number);addFloat(c*T+30,r*T+50,'crispy okoge!','#b07a12',14);}}}}
function updateBelt(dt){beltT+=dt;if(beltT>=STEP){beltT-=STEP;offset=(offset+1)%N;stepCount++;if(state==='play')checkCustomers();}}
function checkCustomers(){for(const s of seats){const cu=s.cust;if(!cu||cu.state!=='wait')continue;const k=slotAt(s.c,9),it=belt[k];
  if(isComplete(it)&&it.top===cu.order){belt[k]=null;serve(s,it);}}}
function serve(s,it){const cu=s.cust;let tip=20+Math.round(15*cu.pat);const tags=[];
  if(it.rice.okoge){tip+=8;stats.okoge++;tags.push('okoge +8');}
  if(it.by.size>=2){tip=Math.round(tip*1.5);stats.handoffs++;tags.push('hand-off ×1.5');}
  tips+=tip;stats.served++;cu.state='eat';cu.t=0;cu.plate=it;SFX.serve();players.forEach(p=>rumble(p,110,.15,.4));
  const x=s.c*T+30,y=10*T;addFloat(x,y-30,'+'+tip,'#1f7a4a',24);tags.forEach((t,i)=>addFloat(x,y-56-i*18,t,'#2F3B5C',13));}
function updateCustomers(dt){
  for(const s of seats){const cu=s.cust;if(!cu)continue;cu.t+=dt;
    if(cu.state==='wait'){cu.pat-=dt/PATIENCE;if(cu.pat<=0){cu.state='leave';cu.t=0;stats.sleepy++;SFX.sleepy();addFloat(s.c*T+30,10*T-20,'zzz… dozed off','#6b7177',13);}}
    else if(cu.state==='eat'&&cu.t>2.6){cu.state='leave';cu.t=0;}
    else if(cu.state==='leave'&&cu.t>1){s.cust=null;}}
  if(time<DAY-15){spawnT-=dt;if(spawnT<=0){const free=seats.filter(s=>!s.cust);
    if(free.length){const s=free[Math.floor(Math.random()*free.length)];s.cust={order:ORDERS[Math.floor(Math.random()*ORDERS.length)],pat:1,state:'wait',t:0,col:CUSTCOL[Math.floor(Math.random()*CUSTCOL.length)],bob:Math.random()*6};}
    const prog=time/DAY;spawnT=(13-6*prog)/(1+.45*(players.length-1))*(.8+Math.random()*.4);}}}
function update(dt){
  pollSources();
  floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.4);
  if(state==='end'){endT+=dt;if(endT>1.6&&players.some(p=>{const i=readSrc(p.src),e=i.btn&&!p.prev;p.prev=i.btn;return e;})){state='lobby';reset();}return;}
