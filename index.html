<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>bed of rice — tiny rice friends, coming soon</title>
    <meta name="description" content="bed of rice — a cute little world of collectible rice characters and stickers. Something soft & squishy is on the way." />
    <meta name="theme-color" content="#fbefe0" />
    <meta property="og:title" content="bed of rice" />
    <meta property="og:description" content="tiny rice friends. collectible stickers & squishy characters — dropping soon." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%99%3C/text%3E%3C/svg%3E"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root {
        --cream: #fbefe0;
        --cream-2: #fff7ec;
        --ink: #5a4636;
        --ink-dim: #a08a76;
        --nori: #3f6b52;
        --salmon: #f7a58b;
        --plum: #c98bb9;
      }
      html, body { height: 100%; }
      body {
        min-height: 100dvh;
        background:
          radial-gradient(60% 45% at 18% 12%, #ffe6ec 0%, transparent 60%),
          radial-gradient(55% 45% at 85% 20%, #e6f0ff 0%, transparent 60%),
          radial-gradient(70% 55% at 50% 110%, #fff2d6 0%, transparent 60%),
          linear-gradient(180deg, var(--cream-2), var(--cream));
        color: var(--ink);
        font-family: 'Baloo 2', 'Segoe UI Rounded', ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
        overflow-x: hidden;
        user-select: none;
      }

      /* floating character cluster */
      .stage {
        position: relative;
        width: min(420px, 92vw);
        height: clamp(180px, 34vh, 260px);
        margin-bottom: 6px;
      }
      .rice {
        position: absolute;
        font-size: clamp(44px, 11vw, 66px);
        filter: drop-shadow(0 10px 14px rgba(120, 90, 60, 0.22));
        animation: bob 3.6s ease-in-out infinite;
      }
      .r0 { left: 50%; top: 8%;  transform: translateX(-50%); font-size: clamp(78px, 20vw, 118px); animation-duration: 4.2s; }
      .r1 { left: 8%;  top: 52%; animation-delay: -0.6s; }
      .r2 { right: 6%; top: 46%; animation-delay: -1.2s; }
      .r3 { left: 20%; top: 6%;  animation-delay: -1.8s; font-size: clamp(34px, 8vw, 46px); }
      .r4 { right: 16%; top: 4%; animation-delay: -2.4s; font-size: clamp(34px, 8vw, 46px); }
      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-4deg); }
        50% { transform: translateY(-14px) rotate(4deg); }
      }
      .r0 { animation-name: bob-center; }
      @keyframes bob-center {
        0%, 100% { transform: translateX(-50%) translateY(0) rotate(-3deg); }
        50% { transform: translateX(-50%) translateY(-16px) rotate(3deg); }
      }

      .wordmark {
        font-size: clamp(44px, 13vw, 78px);
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 0.95;
        color: var(--ink);
      }
      .wordmark .of { color: var(--salmon); }
      .tagline {
        margin-top: 14px;
        font-size: clamp(15px, 4.4vw, 19px);
        font-weight: 600;
        color: var(--ink-dim);
        max-width: 30ch;
        text-wrap: balance;
      }
      .pill {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 2px solid #f2ddc7;
        border-radius: 999px;
        padding: 10px 20px;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--nori);
        box-shadow: 0 8px 22px rgba(150, 110, 70, 0.14);
      }
      .pill .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--salmon);
        animation: blink 1.6s ease-in-out infinite;
      }
      @keyframes blink { 50% { opacity: 0.3; } }

      .lineup {
        margin-top: 26px;
        display: flex;
        gap: 10px;
        font-size: 22px;
        opacity: 0.85;
      }
      footer {
        margin-top: 34px;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-dim);
        font-weight: 700;
      }
      @media (prefers-reduced-motion: reduce) {
        .rice, .pill .dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <span class="rice r0">🍙</span>
      <span class="rice r1">🍚</span>
      <span class="rice r2">🍣</span>
      <span class="rice r3">🍡</span>
      <span class="rice r4">🍥</span>
    </div>

    <h1 class="wordmark">bed<span class="of"> of </span>rice</h1>
    <p class="tagline">tiny rice friends — collectible stickers &amp; squishy little characters, dropping soon.</p>

    <span class="pill"><span class="dot"></span> Coming Soon</span>

    <div class="lineup" aria-hidden="true">🍙 🍘 🍚 🍡 🍢 🍣 🍥</div>

    <footer>bed of rice · est. 2026</footer>
  </body>
</html>
